name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests && ruff format --check src tests
      - name: Unit tests
        run: pytest -q
      - name: Evaluation quality gate (offline generator)
        run: finrag-eval --min-score 0.9 --json eval-report.json
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: eval-report
          path: eval-report.json

  docker:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t finrag .
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name finrag finrag
          for i in $(seq 1 20); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs -X POST localhost:8000/ask -H 'content-type: application/json' \
               -d '{"question":"What is the minimum CET1 ratio?"}' | tee /dev/stderr | grep -q '4.5%'
